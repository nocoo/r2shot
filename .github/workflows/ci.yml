name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: "1.4.2"
      install-policy: "blocked"
      coverage-path: "coverage"
      prepare-command: "bun run build"
      test-command: "bun run test:coverage"
      typecheck: false
      disabled-check-reasons: '{"typecheck": "tsc --noEmit already executed as part of bun run build"}'
      l2: true
      l2-command: "bun run test:e2e"
