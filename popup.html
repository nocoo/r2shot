<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>R2Shot</title><link rel="icon" href="/icons/logo32.png"><link rel="stylesheet" href="/src/shared/index.css"></head>
<body class="popup">
  <header class="popup-header"><div class="brand"><img src="/icons/logo64.png" alt="" width="28" height="28"><div><h1>R2Shot</h1><small data-i18n="productTagline">Capture. Upload. Share.</small></div></div><button type="button" id="settings" class="btn-icon" aria-label="Settings" data-i18n-aria-label="settings" data-i18n-title="settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg></button></header>
  <main>
    <div class="page-context"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/></svg><div><strong id="page-title" data-i18n="currentPage">Current page</strong><small id="page-host"></small></div></div>
    <fieldset class="scope" id="capture-scope"><legend class="eyebrow" data-i18n="captureArea">Capture area</legend><label><input type="radio" name="scope" value="visible" checked><span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg><span data-i18n="visibleArea">Visible area</span></span></label><label><input type="radio" name="scope" value="full"><span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3H4v4m13-4h3v4M4 17v4h3m13-4v4h-3M8 7h8M8 11h8M8 15h8"/></svg><span data-i18n="fullPage">Full page</span></span></label></fieldset>
    <div class="destination"><div><p class="eyebrow" data-i18n="destination">Destination</p><strong id="bucket" data-i18n="setupRequired">Set up your R2 bucket</strong><p class="hint" id="capture-details"></p></div><span class="badge">Cloudflare R2</span></div>
    <button type="button" id="capture" class="btn-primary capture-button" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h4l2-3h4l2 3h4v13H4Z"/><circle cx="12" cy="13" r="4"/></svg><span data-i18n="captureUpload">Capture &amp; upload</span></button>
    <p id="capture-status" class="capture-status" role="status" aria-live="polite"></p>
    <section id="result" class="result" hidden><label for="result-url" data-i18n="publicLink">Public link</label><input id="result-url" readonly><div class="result-actions"><button type="button" id="copy" class="btn-primary" data-i18n="copyUrl">Copy URL</button><button type="button" id="new" class="btn-secondary" data-i18n="new">New</button></div></section>
  </main>
  <footer class="brand-footer"><span><i class="dot"></i><span data-i18n="yourBucket">Your bucket. Your files.</span></span><a href="https://hexly.ai" target="_blank" rel="noopener noreferrer">a product of hexly.ai ↗</a></footer>
  <script type="module" src="/src/popup/main.js"></script>
</body></html>
